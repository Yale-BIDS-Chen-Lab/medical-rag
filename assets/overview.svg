<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="350" viewBox="0 0 1024 350" role="img" aria-labelledby="title desc">
  <title id="title">Medical RAG overview</title>
  <desc id="desc">Four capabilities correspond to Highlights: 1 query reformulation, 2 evidence retrieval, 3 evidence filtering, and 4 expert evaluation data. A query flows through retrieval, optional filtering, and generation to a response. Reformulation is optional. Evaluation data covers evidence and response quality across the pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 3.5 0 7Z" fill="#6b818d"/></marker>
    <marker id="teal-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 3.5 0 7Z" fill="#4a9186"/></marker>
  </defs>
  <rect width="1024" height="350" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173547">
    <text x="29" y="172" font-size="21">Query</text>
    <text x="917" y="172" font-size="21">Response</text>

    <path d="M96 165H207M383 165H448M640 165H705M881 165H906" fill="none" stroke="#6b818d" stroke-width="1.5"/>
    <path d="M197 161L205 165L197 169M438 161L446 165L438 169M695 161L703 165L695 169M896 161L904 165L896 169" fill="none" stroke="#6b818d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="208" y="130" width="174" height="70" rx="7" fill="#f0f5f8" stroke="#b7cbd5" stroke-width="1.3"/>
    <text x="295" y="173" text-anchor="middle" font-size="22">Retrieval</text>
    <rect x="449" y="130" width="190" height="70" rx="7" fill="#edf6f3" stroke="#a4c9be" stroke-width="1.3"/>
    <text x="544" y="173" text-anchor="middle" font-size="21">Evidence filtering</text>
    <rect x="706" y="130" width="174" height="70" rx="7" fill="#f7f9fa" stroke="#c7d2d8" stroke-width="1.3"/>
    <text x="793" y="173" text-anchor="middle" font-size="22">Generation</text>

    <rect x="28" y="25" width="236" height="54" rx="7" fill="#edf6f3" stroke="#a4c9be" stroke-width="1.3"/>
    <text x="146" y="59" text-anchor="middle" font-size="21">Query reformulation</text>
    <path d="M55 148V80" stroke="#4a9186" stroke-width="1.5" fill="none" marker-end="url(#teal-arrow)"/>
    <path d="M265 52H295V129" stroke="#4a9186" stroke-width="1.5" fill="none" marker-end="url(#teal-arrow)"/>
    <text x="146" y="103" text-anchor="middle" font-size="15" fill="#6d8186">optional</text>

    <path d="M411 165V102H676V163" stroke="#9aabb4" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
    <text x="544" y="222" text-anchor="middle" font-size="15" fill="#6d8186">optional</text>

    <rect x="337" y="28" width="176" height="47" rx="7" fill="#f7f9fa" stroke="#c7d2d8" stroke-width="1.2"/>
    <text x="425" y="58" text-anchor="middle" font-size="18">Corpus + index</text>
    <path d="M425 76V94H352V129" stroke="#879ba6" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <path d="M208 231V245H880V231M544 245V263" fill="none" stroke="#c4d3d9" stroke-width="1.4" stroke-linecap="round"/>
    <text x="561" y="291" text-anchor="middle" font-size="21" font-weight="600">Expert evaluation data</text>
    <text x="544" y="319" text-anchor="middle" font-size="16" fill="#6b818d">Retrieval · Selection · Factuality · Completeness</text>

    <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="29" cy="26" r="14" fill="#337d72"/><text x="29" y="31">1</text>
      <circle cx="209" cy="131" r="14" fill="#476f83"/><text x="209" y="136">2</text>
      <circle cx="450" cy="131" r="14" fill="#337d72"/><text x="450" y="136">3</text>
      <circle cx="419" cy="284" r="14" fill="#476f83"/><text x="419" y="289">4</text>
    </g>
  </g>
</svg>
