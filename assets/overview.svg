<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Medical RAG component overview</title>
  <desc id="desc">A medical query retrieves corpus passages for response generation. Query reformulation before retrieval and evidence filtering after retrieval are optional. Examples demonstrate the components separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#78909c"/></marker>
    <marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#0f766e"/></marker>
  </defs>
  <rect x="1" y="1" width="1158" height="428" rx="20" fill="#ffffff" stroke="#dce5eb" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="32" y="28" width="180" height="83" rx="12" fill="#edf7f5" stroke="#9bcfc7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="50" y="54" font-size="11" font-weight="700" letter-spacing="1" fill="#0f766e">OPTIONAL</text>
    <text x="50" y="78" font-size="17" font-weight="700" fill="#12283f">Reformulate query</text>
    <text x="50" y="97" font-size="12" fill="#516477">Rationale-based retrieval</text>
    <path d="M122 162V112" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#teal-arrow)"/>
    <path d="M212 70H238V205H268" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#teal-arrow)"/>
    <path d="M212 235H268M498 235H554M784 235H840" fill="none" stroke="#78909c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="162" width="180" height="126" rx="13" fill="#f5f8fb" stroke="#dce5eb" stroke-width="1.5"/>
    <text x="50" y="191" font-size="11" font-weight="700" letter-spacing="1" fill="#65788a">INPUT</text>
    <text x="50" y="226" font-size="22" font-weight="700" fill="#12283f">Medical query</text>
    <text x="50" y="253" font-size="14" fill="#516477">A question to investigate</text>
    <rect x="268" y="162" width="230" height="126" rx="13" fill="#f5f8fb" stroke="#dce5eb" stroke-width="1.5"/>
    <text x="288" y="191" font-size="11" font-weight="700" letter-spacing="1" fill="#65788a">RETRIEVAL</text>
    <text x="288" y="226" font-size="22" font-weight="700" fill="#12283f">Retrieve passages</text>
    <text x="288" y="253" font-size="14" fill="#516477">Sparse · Dense · Fusion</text>
    <rect x="554" y="162" width="230" height="126" rx="13" fill="#edf7f5" stroke="#9bcfc7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="574" y="191" font-size="11" font-weight="700" letter-spacing="1" fill="#0f766e">OPTIONAL</text>
    <text x="574" y="226" font-size="22" font-weight="700" fill="#12283f">Filter evidence</text>
    <text x="574" y="253" font-size="14" fill="#516477">Query–passage judgments</text>
    <rect x="840" y="162" width="288" height="126" rx="13" fill="#12283f"/>
    <text x="862" y="191" font-size="11" font-weight="700" letter-spacing="1" fill="#a7dcd4">GENERATION</text>
    <text x="862" y="226" font-size="22" font-weight="700" fill="#ffffff">Generate a response</text>
    <text x="862" y="253" font-size="14" fill="#d2dee8">Use the selected evidence</text>
    <rect x="268" y="330" width="230" height="57" rx="10" fill="#f5f8fb" stroke="#dce5eb" stroke-width="1.5"/>
    <text x="383" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#12283f">Medical corpus</text>
    <text x="383" y="374" text-anchor="middle" font-size="12" fill="#516477">Passages + search index</text>
    <path d="M383 330V289" fill="none" stroke="#78909c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="554" y="354" font-size="13" fill="#516477">Conceptual workflow</text>
    <text x="554" y="375" font-size="13" fill="#516477">Component examples are provided separately.</text>
  </g>
</svg>
