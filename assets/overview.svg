<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="302" viewBox="0 0 1024 302" role="img" aria-labelledby="title desc">
  <title id="title">Medical RAG components</title>
  <desc id="desc">A query passes through retrieval, optional evidence filtering, and generation to produce a response. Query reformulation provides an optional alternative retrieval query. A corpus and its index supply retrieval. The bypass above filtering indicates that it can be skipped.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 3.5 0 7Z" fill="#47515a"/></marker>
    <marker id="accent-arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 3.5 0 7Z" fill="#176b62"/></marker>
  </defs>
  <rect width="1024" height="302" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#24292f" font-size="21">
    <text x="29" y="164">Query</text>
    <text x="917" y="164">Response</text>

    <rect x="208" y="126" width="174" height="62" fill="#ffffff" stroke="#47515a" stroke-width="1.4"/>
    <text x="295" y="164" text-anchor="middle">Retrieval</text>
    <rect x="449" y="126" width="190" height="62" fill="#ffffff" stroke="#176b62" stroke-width="1.4"/>
    <text x="544" y="164" text-anchor="middle" fill="#176b62">Evidence filtering</text>
    <rect x="706" y="126" width="174" height="62" fill="#ffffff" stroke="#47515a" stroke-width="1.4"/>
    <text x="793" y="164" text-anchor="middle">Generation</text>

    <path d="M96 157H207" stroke="#47515a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <path d="M383 157H448" stroke="#47515a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <path d="M640 157H705" stroke="#47515a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <path d="M881 157H906" stroke="#47515a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="28" y="24" width="236" height="54" fill="#ffffff" stroke="#176b62" stroke-width="1.4"/>
    <text x="146" y="58" text-anchor="middle" font-size="20" fill="#176b62">Query reformulation</text>
    <path d="M55 141V79" stroke="#176b62" stroke-width="1.4" fill="none" marker-end="url(#accent-arrow)"/>
    <path d="M265 51H295V125" stroke="#176b62" stroke-width="1.4" fill="none" marker-end="url(#accent-arrow)"/>
    <text x="146" y="101" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#59636e">optional</text>

    <path d="M412 157V92H676V156" stroke="#7e878f" stroke-width="1.1" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
    <text x="544" y="213" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#59636e">optional</text>

    <rect x="208" y="244" width="174" height="42" fill="#ffffff" stroke="#7e878f" stroke-width="1.1"/>
    <text x="295" y="271" text-anchor="middle" font-size="18">Corpus + index</text>
    <path d="M295 243V189" stroke="#47515a" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
